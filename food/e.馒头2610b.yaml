name: 馒头2610b
amount: 8
unit: 个
food:
  - name: 北兴有机石磨全麦粉
    amount: 480.0
    unit: g
log: |
  - 后发酵法
    - 酵母液 = 鲜酵母11.0克 + 水4.0g
    - 面团1 = 全麦粉480.0g + 水232.0g，搅匀、揉成团。
    - 面团1盖膜冷藏静置1小时水合（最长时间可以隔夜、隔天）。17:17
    - 面团2 = 面团1 + 酵母液，揉成光滑面团。面团2重量725.5g，分为8个馒头胚各90.5g、整型。18:17~18:30
    - 馒头胚在蒸箱中发酵90分钟、静置10分钟，上层蒸20分钟。20:11
  - 二次发酵法
    - 酵母液 = 鲜酵母10.0克 + 水
    - 面团1 = 全麦粉450.0g + 酵母液250.0g（含水240.0g） ，搅匀、揉匀。
    - 面团1盖湿盖放进蒸箱发酵60分钟。
    - 面团2 = 面团1 + 全麦粉30.0克，排气、揉匀。面团2重量735.5g，分为8个馒头胚各91.5~92.0、整型。
    - 馒头胚在蒸箱中发酵30分钟，上层蒸20分钟。
comment: |
  - 水的比例合适，面团2手感不错。
  - 高度不足，大概在80分钟塌陷。横向膨胀过度、有发酵过度的大裂痕。下次发酵85分钟。
