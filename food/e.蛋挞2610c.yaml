name: 蛋挞2610c
amount: 4
unit: 个
food:
  - name: 香蕉
    amount: 182.0
    unit: g
  - name: 小象高纤快熟燕麦片
    amount: 100.0
    unit: g
  - name: 鸡蛋
    amount: 99.0
    unit: g
  - name: 河套草原纯奶粉
    amount: 25.0
    unit: g
  - name: 菊粉
    amount: 25.0
    unit: g
log:
  - 用香蕉182.0g、麦片、可可粉混合压成杯状，180°C+10分钟。成为蛋挞胚。
  - 在水杯把奶粉、菊粉、水80.0g摇匀溶解。
  - 在沙拉碗加鸡蛋黄六个，倒入水杯中的奶，搅匀。倒入蛋挞胚。
  - 不预热、上下火、中层层烤架、190°C+20分钟、210°C+3分钟。
comment:
  - 蛋挞皮高处蛋挞液面的很硬、难嚼，低于蛋挞液面的潮湿、口感合适。
  - 甜度合适。
  - 上层烤架160°C+25分钟；
  - 上层烤盘160°C+25分钟、190°C+3分钟；
    - 下次试试170°C+25分钟；
  - 中层190°C+25分钟。
