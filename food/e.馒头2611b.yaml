name: 馒头2611b
amount: 8
unit: 个
food:
  - name: 北兴有机石磨全麦粉
    amount: 480.0
    unit: g
log: |
  - 后发酵法
    - 面团1 = 全麦粉480.0g + 水237.0g，搅匀、揉成团。
    - 面团1盖膜冷藏（冬季可以室温）静置3小时水合（最长时间可以隔夜、隔天）。18:40
    - 酵母液 = 鲜酵母12.5克 + 水3.0g
    - 面团2 = 面团1 + 酵母液，揉成光滑面团。面团2重量732.0g，分为8个馒头胚各91.0~91.5g、整型。21:45~22:04
    - 馒头胚在蒸箱中发酵80分钟，上层蒸20分钟。23:25
  - 二次发酵法
    - 酵母液 = 鲜酵母10.0克 + 水
    - 面团1 = 全麦粉450.0g + 酵母液250.0g（含水240.0g） ，搅匀、揉匀。
    - 面团1盖湿盖放进蒸箱发酵60分钟。
    - 面团2 = 面团1 + 全麦粉30.0克，排气、揉匀。面团2重量735.5g，分为8个馒头胚各91.5~92.0、整型。
    - 馒头胚在蒸箱中发酵30分钟，上层蒸20分钟。
comment: |
  - 水的比例合适，面团2手感不错。
  - 高度合适没有坍塌，横向膨胀也合适。
  - 馒头表面有裂痕，这次发酵后没有打开蒸箱放入其它食材。下次缩短到2小时水合。
