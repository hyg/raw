name: 馒头2609c
amount: 8
unit: 个
food:
  - name: 北兴有机石磨全麦粉
    amount: 480.0
    unit: g
log: |
  - 后发酵法
    - 酵母液 = 鲜酵母9.0克 + 水3.0g
    - 面团1 = 全麦粉480.0g + 水232.0g，搅匀、揉成团。
    - 面团1盖膜冷藏静置1小时水合（最长时间可以隔夜、隔天）。18:06
    - 面团2 = 面团1 + 酵母液，揉成光滑面团。面团2重量722.0g，分为8个馒头胚各90.0~90.5g、整型。19:06~19:25
    - 馒头胚在蒸箱中发酵50分钟，上层蒸20分钟。
  - 二次发酵法
    - 酵母液 = 鲜酵母10.0克 + 水
    - 面团1 = 全麦粉450.0g + 酵母液250.0g（含水240.0g） ，搅匀、揉匀。
    - 面团1盖湿盖放进蒸箱发酵60分钟。
    - 面团2 = 面团1 + 全麦粉30.0克，排气、揉匀。面团2重量735.5g，分为8个馒头胚各91.5~92.0、整型。
    - 馒头胚在蒸箱中发酵30分钟，上层蒸20分钟。
comment: |
  - 加酵母液后面团不粘手了，手感不错。
  - 高度合适，横向膨胀合适。但是质地还不够蓬松，下次发酵55分钟。
