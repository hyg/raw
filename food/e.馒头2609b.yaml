name: 馒头2609b
amount: 8
unit: 个
food:
  - name: 河套全麦100小麦粉
    amount: 90.5
    unit: g
  - name: 北兴有机石磨全麦粉
    amount: 389.5
    unit: g
log: |
  - 后发酵法
    - 酵母液 = 鲜酵母13.0克 + 水4.5g
    - 面团1 = 全麦粉480.0g + 水240.5g，搅匀、揉成团。
    - 面团1盖膜冷藏静置1小时水合（最长时间可以隔夜、隔天）。16:10
    - 面团2 = 面团1 + 酵母液，揉成光滑面团。面团2重量740.0g，分为8个馒头胚各92.0~92.5g、整型。17:58~18:16
    - 馒头胚在蒸箱中发酵60分钟，上层蒸20分钟。
  - 二次发酵法
    - 酵母液 = 鲜酵母10.0克 + 水
    - 面团1 = 全麦粉450.0g + 酵母液250.0g（含水240.0g） ，搅匀、揉匀。
    - 面团1盖湿盖放进蒸箱发酵60分钟。
    - 面团2 = 面团1 + 全麦粉30.0克，排气、揉匀。面团2重量735.5g，分为8个馒头胚各91.5~92.0、整型。
    - 馒头胚在蒸箱中发酵30分钟，上层蒸20分钟。
comment: |
  - 加酵母液后面团还有点粘手。
  - 高度不足，横向膨胀合适。下次发酵45~50分钟试试。
  - 下次用水235克。酵母液只加3.0g，面团1加232.0g。