name: 馒头2608a
amount: 8
unit: 个
food:
  - name: 河套全麦100小麦粉
    amount: 480.0
    unit: g
  - name: 南瓜
    amount: 70.0
    unit: g
    log: 水果南瓜
log: |
  - 南瓜浆 = 去皮南瓜块 + 水，高压锅煮烂、放凉。
  - 酵母液 = 鲜酵母11.5克 + 水
  - 面团1 = 全麦粉450.0g + 酵母液124.0g（含水112.5g） + 南瓜浆143.0g（含水73.0g），搅匀、揉匀。南瓜自带水分外，另加水185.5g。
  - 面团1盖湿盖常温发酵60分钟。09:50
  - 面团2 = 面团1 + 全麦粉30.0克 + 水1~2克，排气、揉匀。面团2重量756.0g，分为8个馒头胚各94.0、整型。10:58
  - 馒头胚在蒸箱中发酵30分钟，上层蒸20分钟。
comment: |
  - 室温28°C，面团1却几乎没有膨胀多少，可能冷冻南瓜的什么成分抑制了酵母。稍微洒了点水湿润一下，才把后加的30克全麦粉揉进去。
  - 高度正常，表面光滑。