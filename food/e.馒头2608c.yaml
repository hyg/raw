name: 馒头2608c
amount: 8
unit: 个
food:
  - name: 河套全麦100小麦粉
    amount: 480.0
    unit: g
log: |
  - 后发酵法
    - 酵母液 = 鲜酵母10.0克 + 水10.0g
    - 面团1 = 全麦粉480.0g + 水240.5g，搅匀、揉成团。
    - 面团1盖膜冷藏静置1小时水合（最长时间可以隔夜、隔天）。9:40
    - 面团2 = 面团1 + 酵母液，揉成光滑面团。面团2重量737.5g，分为8个馒头胚各91.0~91.5g、整型。10:55
  - 二次发酵法
    - 酵母液 = 鲜酵母10.0克 + 水
    - 面团1 = 全麦粉450.0g + 酵母液250.0g（含水240.0g） ，搅匀、揉匀。
    - 面团1盖湿盖放进蒸箱发酵60分钟。
    - 面团2 = 面团1 + 全麦粉30.0克，排气、揉匀。面团2重量735.5g，分为8个馒头胚各91.5~92.0、整型。
  - 馒头胚在蒸箱中发酵30分钟，上层蒸20分钟。
comment: |
  - 加酵母液后面团太粘手。
  - 高度合适，横向膨胀也可以。
  - 下次用水245克。酵母液只加5.0g，面团1仍然加240.0g。