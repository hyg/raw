log:
  - 用香蕉、麦片、可可粉混合压成杯状，180°C+10分钟。成为蛋挞胚七个。
  - 在水杯把奶粉、菊粉、水100.0g摇匀溶解。
  - 在沙拉碗加鸡蛋黄七个，倒入水杯中的奶，搅匀。倒入蛋挞胚。
  - 不预热、上下火、六个中层烤架、一个下层烤盘、190°C+24分钟、180°C+1分钟。
comment:
  - 蛋挞液略多，下次80.0g水。
  - 蛋挞皮高处蛋挞液面的很硬、难嚼，低于蛋挞液面的潮湿、口感合适。
  - 甜度合适。
  - 上层烤架160°C+25分钟；
  - 上层烤盘160°C+25分钟、190°C+3分钟；
    - 下次试试170°C+25分钟；
  - 中层190°C+25分钟。
